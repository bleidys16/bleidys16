<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="header-title header-desc">
  <title id="header-title">Bleidys Larios — Full Stack Developer &amp; Data Student</title>
  <desc id="header-desc">Terminal header for Bleidys Larios — Software &amp; Data Engineering Student</desc>

  <defs>
    <style><![CDATA[
      .sans { font-family: 'Segoe UI Variable Display', 'Segoe UI', 'SF Pro Display', Inter, system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'DM Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }

      .pulse-slow { animation: pulseGlow 3s ease-in-out infinite; transform-origin: center; }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.15); } }

      @media (prefers-reduced-motion: reduce) {
        .pulse-slow { animation: none !important; }
      }
    ]]></style>

    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141016" />
      <stop offset="50%" stop-color="#1B1421" />
      <stop offset="100%" stop-color="#231929" />
    </linearGradient>

    <radialGradient id="h-glowA" cx="12%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#E8A9C4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#E8A9C4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="h-glowB" cx="88%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#8D6A91" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8D6A91" stop-opacity="0" />
    </radialGradient>

    <pattern id="h-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#F7F4F5" fill-opacity="0.04" />
    </pattern>

    <linearGradient id="title-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7F4F5" />
      <stop offset="45%" stop-color="#E8C9D8" />
      <stop offset="100%" stop-color="#E8A9C4" />
    </linearGradient>

    <clipPath id="h-frame">
      <rect width="1200" height="230" rx="24" />
    </clipPath>
  </defs>

  <!-- BACKGROUND & ATMOSPHERE -->
  <g clip-path="url(#h-frame)">
    <rect width="1200" height="230" fill="url(#bg-grad)" />
    <rect width="1200" height="230" fill="url(#h-dots)" />
    <rect width="1200" height="230" fill="url(#h-glowA)" />
    <rect width="1200" height="230" fill="url(#h-glowB)" />
  </g>

  <!-- OUTER BORDER -->
  <rect x="0.5" y="0.5" width="1199" height="229" rx="24" fill="none" stroke="#E8A9C4" stroke-opacity="0.18" stroke-width="1.2" />

  <!-- TOP TERMINAL BAR -->
  <g transform="translate(44, 28)">
    <!-- Window controls -->
    <circle cx="10" cy="10" r="5" fill="#E8A9C4" />
    <circle cx="28" cy="10" r="5" fill="#B9A0C9" />
    <circle cx="46" cy="10" r="5" fill="#8D6A91" />

    <!-- Terminal Path Badge -->
    <text class="mono" x="72" y="14" font-size="13" font-weight="600" fill="#918A91">
      <tspan fill="#E8A9C4">bleidys@dev</tspan>:<tspan fill="#B9A0C9">~/workspace</tspan><tspan fill="#918A91"> (main) ✦</tspan>
    </text>

    <!-- Status pill on the right -->
    <g transform="translate(890, -4)">
      <rect width="220" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#E8A9C4" stroke-opacity="0.22" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#10B981" />
      <circle cx="16" cy="14" r="4" fill="#10B981" opacity="0.4" class="pulse-slow" />
      <text class="sans" x="28" y="18" font-size="12" font-weight="600" fill="#F7F4F5">Open to opportunities ♡</text>
    </g>
  </g>

  <!-- CONTENT SECTION -->
  <g transform="translate(44, 76)">
    <!-- Kicker Tag -->
    <text class="mono" x="0" y="24" font-size="13" font-weight="700" fill="#E8A9C4" letter-spacing="2">✦ FULL STACK &amp; DATA</text>

    <!-- Big Headline Name -->
    <text class="sans" x="0" y="72" font-size="46" font-weight="800" fill="url(#title-gradient)" letter-spacing="-0.8">
      Bleidys Larios
    </text>

    <!-- Subtitle role -->
    <text class="sans" x="0" y="104" font-size="18" font-weight="600" fill="#B9A0C9">
      Software &amp; Data Engineering Student
    </text>

    <!-- Bio tagline -->
    <text class="sans" x="0" y="130" font-size="14.5" fill="#918A91">
      Bridging reactive frontend interfaces with solid backend APIs and data insights.
    </text>
  </g>
</svg>