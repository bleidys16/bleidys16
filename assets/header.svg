<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 225" width="1200" height="225" role="img" aria-labelledby="header-title header-desc">
  <title id="header-title">Bleidys Larios — Full Stack Developer &amp; Data Student</title>
  <desc id="header-desc">Terminal header for Bleidys Larios — Software &amp; Data Engineering Student</desc>

  <defs>
    <style><![CDATA[
      .sans { font-family: 'Segoe UI Variable Display', 'Segoe UI', 'SF Pro Display', Inter, system-ui, -apple-system, sans-serif; }
      .mono { font-family: 'DM Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }

      /* Floating Ambient Sparkles */
      .sparkle { animation: rise 6.5s ease-in infinite; opacity: 0; }
      @keyframes rise {
        0% { opacity: 0; transform: translateY(0px) scale(0.6); }
        30% { opacity: 0.85; }
        70% { opacity: 0.55; }
        100% { opacity: 0; transform: translateY(-70px) scale(1.15); }
      }

      @media (prefers-reduced-motion: reduce) {
        .sparkle { animation: none !important; }
      }
    ]]></style>

    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141016" />
      <stop offset="50%" stop-color="#1B1421" />
      <stop offset="100%" stop-color="#231929" />
    </linearGradient>

    <radialGradient id="h-glowA" cx="12%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#E8A9C4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#E8A9C4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="h-glowB" cx="88%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#8D6A91" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8D6A91" stop-opacity="0" />
    </radialGradient>

    <pattern id="h-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#F7F4F5" fill-opacity="0.04" />
    </pattern>

    <linearGradient id="title-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7F4F5" />
      <stop offset="45%" stop-color="#E8C9D8" />
      <stop offset="100%" stop-color="#E8A9C4" />
    </linearGradient>

    <clipPath id="h-frame">
      <rect width="1200" height="225" rx="24" />
    </clipPath>
  </defs>

  <!-- BACKGROUND & ATMOSPHERE -->
  <g clip-path="url(#h-frame)">
    <rect width="1200" height="225" fill="url(#bg-grad)" />
    <rect width="1200" height="225" fill="url(#h-dots)" />
    <rect width="1200" height="225" fill="url(#h-glowA)" />
    <rect width="1200" height="225" fill="url(#h-glowB)" />

    <!-- Floating Sparkles & Stars -->
    <circle class="sparkle" cx="620" cy="180" r="2.2" fill="#E8A9C4" style="animation-delay: 0s;" />
    <circle class="sparkle" cx="740" cy="190" r="1.8" fill="#B9A0C9" style="animation-delay: -1.5s;" />
    <circle class="sparkle" cx="870" cy="160" r="2.5" fill="#F7F4F5" style="animation-delay: -3.0s;" />
    <circle class="sparkle" cx="990" cy="185" r="2.0" fill="#E8A9C4" style="animation-delay: -4.5s;" />
    <circle class="sparkle" cx="1080" cy="150" r="1.8" fill="#B9A0C9" style="animation-delay: -2.2s;" />
    <circle class="sparkle" cx="530" cy="180" r="1.5" fill="#E8C9D8" style="animation-delay: -5.1s;" />

    <path class="sparkle" d="M 800,125 Q 800,131 806,131 Q 800,131 800,137 Q 800,131 794,131 Q 800,131 800,125 Z" fill="#E8A9C4" style="animation-delay: -0.8s;" />
    <path class="sparkle" d="M 940,105 Q 940,111 946,111 Q 940,111 940,117 Q 940,111 934,111 Q 940,111 940,105 Z" fill="#B9A0C9" style="animation-delay: -3.6s;" />
    <path class="sparkle" d="M 1040,165 Q 1040,170 1045,170 Q 1040,170 1040,175 Q 1040,170 1035,170 Q 1040,170 1040,165 Z" fill="#E8A9C4" style="animation-delay: -2.5s;" />
  </g>

  <!-- OUTER BORDER -->
  <rect x="0.5" y="0.5" width="1199" height="224" rx="24" fill="none" stroke="#E8A9C4" stroke-opacity="0.18" stroke-width="1.2" />

  <!-- TOP TERMINAL BAR -->
  <g transform="translate(44, 26)">
    <!-- Window controls -->
    <circle cx="10" cy="10" r="5" fill="#E8A9C4" />
    <circle cx="28" cy="10" r="5" fill="#B9A0C9" />
    <circle cx="46" cy="10" r="5" fill="#8D6A91" />

    <!-- Terminal Path Badge -->
    <text class="mono" x="72" y="14" font-size="13" font-weight="600" fill="#918A91">
      <tspan fill="#E8A9C4">bleidys@dev</tspan>:<tspan fill="#B9A0C9">~/workspace</tspan><tspan fill="#918A91"> (main) ✦</tspan>
    </text>

    <!-- Status pill on the right (static green dot) -->
    <g transform="translate(884, -6)">
      <rect width="228" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#E8A9C4" stroke-opacity="0.25" stroke-width="1.2" />
      <circle cx="28" cy="16" r="4.5" fill="#10B981" />
      <text class="sans" x="40" y="16" font-size="13.5" font-weight="600" fill="#F7F4F5" dominant-baseline="central">Open to opportunities ♡</text>
    </g>
  </g>

  <!-- CONTENT SECTION (VERTICALLY CENTERED: 34px to bar, 34px to bottom) -->
  <g transform="translate(44, 82)">
    <!-- Kicker Tag -->
    <text class="mono" x="0" y="15" font-size="14" font-weight="700" fill="#E8A9C4" letter-spacing="2.2">✦ FULL STACK &amp; DATA</text>

    <!-- Big Headline Name -->
    <text class="sans" x="0" y="66" font-size="50" font-weight="800" fill="url(#title-gradient)" letter-spacing="-1">
      Bleidys Larios
    </text>

    <!-- Subtitle role -->
    <text class="sans" x="0" y="104" font-size="20" font-weight="600" fill="#B9A0C9">
      Software &amp; Data Engineering Student
    </text>
  </g>
</svg>