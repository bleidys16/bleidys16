name: Update GitHub Stats & Activity Heatmap

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allows running manually anytime from the Actions tab with 1 click
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update GitHub Stats and Calendar SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PRIVATE_CONTRIBUTIONS: 21
        run: |
          python scripts/update_stats.py

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/spent-my-time.svg
          if git diff --staged --quiet; then
            echo "No changes in SVG files to commit."
          else
            git commit -m "🤖 Auto-update GitHub stats & activity heatmap [skip ci]"
            git push
          fi
